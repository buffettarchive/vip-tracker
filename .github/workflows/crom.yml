name: Buffett Archive Cron
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      fix_etc:
        description: '기타 항목만 재처리 (체크 시)'
        type: boolean
        default: false
      firm:
        description: '특정 운용사만 백필 (예: Orbis,Pzena) 비우면 전체'
        type: string
        default: ''
      backfill_days:
        description: '백필 기간 (일수, 비우면 일반 실행)'
        type: string
        default: ''

jobs:
  fetch-insider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch_insider.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
  fetch-vip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          CMD="python fetch_vip.py"
          if [ "${{ inputs.fix_etc }}" = "true" ]; then
            CMD="$CMD --fix-etc"
          fi
          if [ -n "${{ inputs.backfill_days }}" ]; then
            CMD="$CMD --backfill-days ${{ inputs.backfill_days }}"
          fi
          if [ -n "${{ inputs.firm }}" ]; then
            IFS=',' read -ra FIRMS <<< "${{ inputs.firm }}"
            for f in "${FIRMS[@]}"; do
              CMD="$CMD --firm $f"
            done
          fi
          echo "실행: $CMD"
          eval $CMD
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
  fetch-buyback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch_buyback.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
  fetch-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch_market.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
