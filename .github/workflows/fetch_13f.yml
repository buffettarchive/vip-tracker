name: 미국 투자거장 13F 포트폴리오 갱신

on:
  schedule:
    # 2, 5, 8, 11월 1일부터 20일까지 하루 두 번(한국시간 오전 9시, 오후 9시) 실행 (마감일이 주말이면 다음 월요일로 밀리므로 20일까지 확인)
    - cron: '0 0,12 1-20 2,5,8,11 *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-13f-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install requests
        run: pip install requests
        
      - name: 13F 데이터 수집 및 커밋
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python fetch_13f.py
